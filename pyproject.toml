[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-edge"
version = "0.1.0"
description = "Calibrated fair values and paper trading for Kalshi daily high-temperature markets"
requires-python = ">=3.11"

[project.scripts]
weather-edge = "weather_edge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Aligned lookup table and real-API fixtures read better unwrapped.
"src/weather_edge/stations.py" = ["E501"]
"tests/*" = ["E501"]
